<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Welcome2GH: Smart tourism and student assistant for Accra, Ghana. Explore places, get fair prices, and navigate Accra safely.">
  <meta name="theme-color" content="#0D1B2A">

  <!-- Open Graph / Social sharing -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Welcome2GH: Explore Accra">
  <meta property="og:description" content="Smart tourism and student assistant for Accra, Ghana.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Welcome2GH">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- MapLibre GL (vector 3D maps). The `maplibre` Flutter package renders
       through maplibre-gl-js on web and does NOT auto-inject these, so the map
       would be blank without them. -->
  <script src='https://unpkg.com/maplibre-gl@^5.0/dist/maplibre-gl.js'></script>
  <link href='https://unpkg.com/maplibre-gl@^5.0/dist/maplibre-gl.css' rel='stylesheet' />
  <script src='https://unpkg.com/pmtiles@^4.0/dist/pmtiles.js'></script>

  <title>Welcome2GH: Explore Accra</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Always load the freshest build. Flutter's offline service worker cached
    // old builds aggressively (especially on iOS Safari), so we proactively
    // unregister any existing service worker and clear its caches on load.
    (function () {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations()
          .then(function (regs) { regs.forEach(function (r) { r.unregister(); }); })
          .catch(function () {});
      }
      if (window.caches && caches.keys) {
        caches.keys()
          .then(function (keys) { keys.forEach(function (k) { caches.delete(k); }); })
          .catch(function () {});
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
